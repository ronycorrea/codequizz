name: Publicar CodeQuizz

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'scripts/check-security.js'
      - 'scripts/audit-public-artifact.js'
      - 'scripts/security-content.js'
      - 'js/public-api-key.js'
      - 'security/public-files.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar verificadores revisados
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false

      - name: Baixar somente o site publico
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Auditar a distribuicao
        # O checkout cria .git; esses metadados nao pertencem ao artefato.
        # Caminho fixo dentro do workspace temporario do runner.
        run: |
          rm -rf -- site/.git
          node source/scripts/check-security.js --artifact site --policy source/security/public-files.json

      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Enviar somente a arvore auditada
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
