name: Publicar CodeQuizz

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar somente o site publico revisado
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Conferir as entradas dos dois modos
        shell: bash
        run: |
          test -f site/index.html
          test -f site/campanha/index.html
          test -f site/js/app.js
          test -f site/js/narrative-app.js
          test -f site/config/supabase.json
          test ! -d site/privado
          test ! -d site/node_modules

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar site publico
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
